name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install ruff==0.17.1
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
      - run: >
          pip install pytorch-lightning==1.9.5 "setuptools<70" hydra-core==1.1.0 omegaconf==2.1.2 numpy==1.21.1
          pandas==1.4.1 scipy==1.10.1 scikit-learn==1.5.0 rasterio==1.2.10 pyyaml
      - run: python tests/test_revision.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
